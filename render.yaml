services:
  # Backend Service
  - type: web
    name: portfolio-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start

  # Frontend Service (Create React App)
  - type: static
    name: portfolio-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://portfolio-backend-qw1a.onrender.com