services:
  # Backend Service
  - type: web
    name: portfolio-backend
    env: node # or python if using Flask
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install # or pip install -r requirements.txt
    startCommand: npm start # or python app.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

  # Frontend Service (Static Site)
  - type: static
    name: portfolio-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist # or build, depending on your Vite/React config
    envVars:
      - key: VITE_API_URL # Point your frontend to the backend URL
        value: [https://portfolio-backend.onrender.com](https://portfolio-backend.onrender.com)