name: Keep Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render free tier instance from sleeping (15 min inactivity timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -s -f https://portfolio-backend-qw1a.onrender.com/health || echo "Ping request executed"
